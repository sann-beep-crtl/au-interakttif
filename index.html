<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alternate Universe</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#000;
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", Helvetica, Arial, sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
  }
  .phone{
    width:100%;
    max-width:430px;
    height:100vh;
    max-height:880px;
    position:relative;
    background:url('kim.jpeg') center/cover no-repeat;
    overflow:hidden;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  }

  /* Status Bar Atas ala iPhone */
  .status-bar{
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 28px 0 32px;
    color: #fff;
    font-weight: 600;
    z-index: 100;
  }
  .time-status{
    font-size: 15px;
    letter-spacing: 0.5px;
  }
  .right-icons{
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
  }
  .battery{
    width: 24px;
    height: 11px;
    border: 1px solid rgba(255, 255, 255, 0.8);
    border-radius: 3px;
    position: relative;
    display: flex;
    align-items: center;
    padding: 1.5px;
  }
  .battery::after{
    content: "";
    position: absolute;
    right: -3px;
    top: 50%;
    transform: translateY(-50%);
    width: 1.5px;
    height: 4px;
    background: rgba(255, 255, 255, 0.8);
    border-radius: 0 1px 1px 0;
  }
  .battery-fill{
    width: 75%;
    height: 100%;
    background: #fff;
    border-radius: 1px;
  }

  /* Tampilan Jam Lockscreen Tengah */
  .lock-screen-content {
    position: absolute;
    top: 90px;
    width: 100%;
    text-align: center;
    color: #fff;
    z-index: 10;
  }
  .lock-time {
    font-size: 76px;
    font-weight: 300;
    line-height: 1;
    letter-spacing: -2px;
  }
  .lock-date {
    font-size: 18px;
    font-weight: 500;
    margin-top: 6px;
  }

  /* Kotak Notifikasi WhatsApp Lockscreen (Dijamin Rapi & Ikon Kecil) */
  .lock-notification {
    background: rgba(30, 30, 30, 0.75);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border-radius: 20px;
    padding: 12px 16px;
    position: absolute;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 380px;
    text-align: left;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: #fff;
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  
  /* PENTING: Pengaman ukuran foto agar tidak jadi raksasa */
  .lock-notification img {
    width: 38px !important;
    height: 38px !important;
    min-width: 38px !important;
    min-height: 38px !important;
    max-width: 38px !important;
    max-height: 38px !important;
    border-radius: 50% !important;
    object-fit: cover !important;
    flex-shrink: 0 !important;
  }
  
  .notif-text h4 {
    font-size: 12px;
    font-weight: 500;
    opacity: 0.8;
    margin-bottom: 2px;
    letter-spacing: 0.3px;
  }
  .notif-text p {
    font-size: 14px;
    font-weight: 400;
  }
</style>
</head>
<body>

<div class="phone">
  <!-- Status Bar Atas -->
  <div class="status-bar">
    <div class="time-status" id="statusBarTime">21:40</div>
    <div class="right-icons">
      <span>📶</span>
      <span>📡</span>
      <span class="battery"><span class="battery-fill"></span></span>
    </div>
  </div>

  <!-- Jam Besar Lockscreen -->
  <div class="lock-screen-content">
    <div class="lock-time" id="lockTime">08:28</div>
    <div class="lock-date">Senin, 11 November</div>
  </div>

  <!-- Notifikasi WhatsApp -->
  <div class="lock-notification">
    <img src="WhatsApp Image 2024-10-08 at 15.26.38_2652ad27.jpg" alt="Kimmy">
    <div class="notif-text">
      <h4>WHATSAPP • 1m ago</h4>
      <p>Kimmy: kamu dimana...</p>
    </div>
  </div>
</div>

<script>
  // Update Jam Real-time
  function updateWaktu(){
    let now = new Date();
    let h = String(now.getHours()).padStart(2,'0');
    let m = String(now.getMinutes()).padStart(2,'0');
    let jamFormat = h + ':' + m;
    
    let elBar = document.getElementById('statusBarTime');
    let elLock = document.getElementById('lockTime');
    if(elBar) elBar.textContent = jamFormat;
    if(elLock) elLock.textContent = jamFormat;
  }
  updateWaktu();
  setInterval(updateWaktu, 1000);
</script>

</body>
</html>
